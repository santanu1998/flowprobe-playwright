name: FlowProbe CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly full regression at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: Tag filter (e.g. @smoke, @regression, @iot)
        default: '@regression'

concurrency:
  group: flowprobe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- static
  static-analysis:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Fail on a known dependency advisory
        run: npm audit --audit-level=high

  # ------------------------------------------------------------- fast gate
  api-suite:
    name: API suite
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run API project
        run: npx playwright test --project=api
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-api
          path: test-results/
          retention-days: 14

  # --------------------------------------------------------- browser matrix
  ui-suite:
    name: UI on ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: api-suite
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      # @visual is excluded here and owned by visual.yml. Screenshot baselines are rendered
      # per operating system, so a baseline committed from a developer's machine can never match
      # a Linux runner. visual.yml generates them on the runner itself, which is the only
      # environment whose rendering is guaranteed to match the one doing the verifying.
      - name: Run ${{ matrix.project }}
        run: >
          npx playwright test --project=${{ matrix.project }}
          --grep-invert @visual
          ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ---------------------------------------------------------- Postman suite
  postman-suite:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot the application under test
        run: FLOWPROBE_TEST_MODE=1 node app/server.js &
      - name: Wait for health
        run: npx wait-on http://localhost:4173/api/health --timeout 30000
      - name: Run the collection
        run: >
          npx newman run postman/FlowProbe_Fleet_API.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit --reporter-junit-export test-results/newman.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-newman
          path: test-results/newman.xml

  # ---------------------------------------------------------------- triage
  triage:
    name: Triage and report
    runs-on: ubuntu-latest
    needs: [api-suite, ui-suite]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          merge-multiple: true
          path: test-results

      - name: Classify failures
        run: node tools/triage.js --input test-results/results.json --out test-results/triage.md

      - name: Comment the triage summary on the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: test-results/triage.md

      - uses: actions/upload-artifact@v5
        with:
          name: triage
          path: test-results/triage.*
